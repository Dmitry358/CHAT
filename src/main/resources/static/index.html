<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>App Chat</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: auto; }
        #chat { border: 3px solid #ccc; height: 300px; overflow-y: auto; padding: 5px; }
        input { width: 79%; height: 30px; border: 3px solid #ccc;}
        button { width: 18%; height: 35px; color: #fff; background-color: rgb(0, 119, 128);}
    </style>
</head>
<body>

<h2>Chat pubblica</h2>
<div id="chat"></div>

<input id="msg" placeholder="Scrivi..." />
<button onclick="send()">Otpravit</button>

<script>
    const protocol = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${protocol}://${location.host}/chat/ws`);
    const chat = document.getElementById("chat");

    ws.onmessage = e => {
      const div = document.createElement("div");
      div.textContent = e.data;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    };

    function send() {
      const input = document.getElementById("msg");
      ws.send(input.value);
      input.value = "";
    }
</script>

</body>
</html>
