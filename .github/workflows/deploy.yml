name: DEPLOY CHAT

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Build and test with Maven
        run: mvn clean package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-jar
          path: target/chat.jar  # Assicurati che il nome del JAR sia corretto

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: chat-jar

      - name: Copy JAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "chat.jar"
          target: "/home/miti/my_apps/chat/"
          strip_components: 0

      - name: Deploy & restart app3
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            echo "📦 Stop app3 if running"
            PID=$(ps aux | grep 'java -jar /home/miti/my_apps/chat/chat.jar' | grep -v grep | awk '{print $2}')
            if [ -n "$PID" ]; then
              kill -9 $PID
              echo "✅ App3 stopped successfully!"
            else
              echo "📦 App3 is not running"
            fi

            echo "📦 Create the app3 directory if it doesn't exist"
            mkdir -p /home/miti/my_apps/chat

            echo "📦 Start app3"
            nohup java -jar /home/miti/my_apps/chat/chat.jar > /home/miti/my_apps/chat/chat.log 2>&1 &

            echo "🔧 Test nginx config"
            sudo nginx -t

            echo "🔄 Reload nginx"
            sudo systemctl reload nginx

            echo "✅ Deploy completato!!"
